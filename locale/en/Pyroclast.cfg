[item-description]
pyroclast-science-pack=Advanced science pack crafted exclusively on the volcanic planet Pyroclast using obsidian and extreme heat.
obsidian=Volcanic glass formed when lava cools under extreme pressure on Pyroclast.
pyroclast-scrap=Volcanic salvage and debris found scattered across Pyroclast's ashen wastes. The primary raw material for basic and explosive war materials.
pyroclast-components=Exotic crystalline metal formations unique to Pyroclast. The primary raw material for construction and refined war materials.
pyroclast-refinery=A volcanic forge designed to process Pyroclast's raw scrap and components into war-grade materials. Can only be built on Pyroclast.
bmat=Basic materials refined from scrap under Pyroclast's extreme volcanic pressure.
cmat=Construction materials refined from components in the Pyroclast Refinery.
emat=Volatile explosive materials synthesized from scrap under Pyroclast's extreme volcanic conditions.
rmat=Precision-refined materials processed from components under extreme pressure.
hemat=Devastating heavy explosive materials combining scrap with sulfuric acid in Pyroclast's volcanic forges.
assmat1=Basic assembly materials for simple vehicles and machines. Forged from basic and explosive materials.
assmat2=Intermediate assembly materials for armored vehicles and trains. Built upon Assembly Materials I.
assmat3=Advanced assembly materials for robotics and heavy machinery. Requires refined materials and expertise.
assmat4=Elite assembly materials for the most powerful military and space equipment. The pinnacle of Pyroclast engineering.
pyroclast-rocket-silo=A reinforced rocket silo designed to withstand Pyroclast's extreme volcanic conditions. Can only be built on Pyroclast.
pyroclast-mpf=A massive volcanic forge for bulk material production. Processes the same recipes as the Refinery, but with 50% built-in productivity bonus. Can only be built on Pyroclast.
pyroclast-coal-generator=A coal-fired power plant built for Pyroclast's extreme volcanic conditions. Can only be built on Pyroclast.
pyroclast-ammo-facility=A military factory for producing ammunition and ordnance from Pyroclast war materials. Can only be built on Pyroclast.
pyroclast-artillery-shell=Volcanic-forged artillery shell with +25% range. Crafted exclusively on Pyroclast.
pyroclast-rocket=Enhanced explosive rocket reinforced with Pyroclast war materials.
pyroclast-atomic-bomb=Supercharged atomic bomb infused with heavy explosive materials from Pyroclast's volcanic forges.
pyroclast-construction-robot=Enhanced construction robot with +50% speed and doubled durability.
pyroclast-logistic-robot=Enhanced logistic robot with +50% speed and doubled durability.
pyroclast-radar=Enhanced radar with doubled scanning range, built with Pyroclast refined materials.
pyroclast-factory=A general-purpose manufacturing building for producing enhanced equipment from Pyroclast war materials. Can only be built on Pyroclast.
pyroclast-firearm-magazine=Volcanic-forged firearm magazine with +50% damage. Crafted exclusively on Pyroclast.
pyroclast-piercing-rounds-magazine=Enhanced piercing rounds with +40% damage, tempered in Pyroclast's volcanic fires.
pyroclast-uranium-rounds-magazine=Supercharged uranium rounds with +30% damage, infused with heavy explosive materials.
pyroclast-shotgun-shell=Volcanic-forged shotgun shells with +50% damage. Crafted exclusively on Pyroclast.
pyroclast-repair-pack=Enhanced repair pack with 2x durability and 50% faster repair speed.
pyroclast-defender-capsule=Enhanced defender capsule deploying stronger combat robots with +50% damage and 2x health.
pyroclast-modular-armor=Enhanced modular armor with a larger 7x7 equipment grid and improved resistances.
pyroclast-power-armor=Enhanced power armor with a larger 9x9 equipment grid and improved resistances.
pyroclast-power-armor-mk2=Elite power armor with a massive 12x12 equipment grid and superior resistances.
pyroclast-mech-armor=Elite mech armor with a 12x12 equipment grid and superior resistances, forged in Pyroclast's volcanic fires.
pyroclast-grenade=Supercharged grenade with +50% damage and +25% blast radius.
pyroclast-cluster-grenade=Devastating cluster grenade with +40% damage and +25% blast radius.

