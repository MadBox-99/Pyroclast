[technology-description]
planet-discovery-pyroclast=Discover Pyroclast: a hyper-volcanic world of extreme pressure and heat, reachable from Vulcanus.
pyroclast-science-pack=Unlock the Pyroclast Science Pack by establishing a base on the volcanic planet Pyroclast and extracting obsidian from its intense lava flows.
pyroclast-refinery=Construct the Pyroclast Refinery, the only building capable of processing raw scrap and components into usable war materials.
pyroclast-materials=Unlock the production of Basic Materials and Construction Materials from scrap and components in the Pyroclast Refinery. Also enables scrap recycling for base material recovery.
pyroclast-explosives=Unlock the production of Explosive Materials from scrap in the Pyroclast Refinery.
pyroclast-refined=Unlock the production of Refined Materials from components in the Pyroclast Refinery.
pyroclast-heavy-explosives=Unlock the production of Heavy Explosive Materials using scrap and sulfuric acid in the Pyroclast Refinery.
pyroclast-assembly-1=Unlock Assembly Materials I for basic vehicle and machine construction.
pyroclast-assembly-2=Unlock Assembly Materials II for armored vehicle and train construction.
pyroclast-assembly-3=Unlock Assembly Materials III for advanced robotics and heavy machinery.
pyroclast-assembly-4=Unlock Assembly Materials IV for the most powerful military and space equipment.
pyroclast-mpf=Construct the Mass Production Factory, a colossal volcanic forge with built-in 50% productivity bonus for all Pyroclast material recipes.
pyroclast-coal-generator=Construct the Coal Power Plant for generating power on Pyroclast.
pyroclast-ammo-facility=Construct the Pyroclast Ammo Facility, a military factory for producing ammunition and ordnance from war materials.
pyroclast-munitions=Unlock enhanced artillery shells and rockets forged in Pyroclast's volcanic fires.
pyroclast-nuclear=Unlock the devastating Pyroclast Atomic Bomb, supercharged with heavy explosive materials.
pyroclast-robotics=Unlock enhanced construction and logistic robots reinforced with Pyroclast materials.
pyroclast-radar-tech=Unlock the Pyroclast Radar with doubled scanning range.
pyroclast-logistics=Unlock crating for all Pyroclast materials. Pack on Pyroclast for 5x transport density, unpack anywhere.
pyroclast-factory=Construct the Pyroclast Factory, a general-purpose manufacturing building for producing enhanced equipment from war materials.
pyroclast-small-arms=Unlock enhanced firearm magazines, piercing rounds, uranium rounds and shotgun shells forged in Pyroclast's volcanic fires.
pyroclast-medical=Unlock enhanced repair packs and defender capsules reinforced with Pyroclast materials.
pyroclast-uniforms=Unlock enhanced modular armor and power armor forged from Pyroclast materials with larger equipment grids.
pyroclast-uniforms-2=Unlock enhanced power armor MK2 and mech armor, the pinnacle of Pyroclast defensive engineering.
pyroclast-utility=Unlock enhanced grenades and cluster grenades supercharged with Pyroclast explosive materials.

