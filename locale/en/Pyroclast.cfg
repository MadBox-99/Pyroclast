[item-description]
pyroclast-science-pack=Advanced science pack crafted exclusively on the volcanic planet Pyroclast using obsidian and extreme heat.
obsidian=Volcanic glass formed when lava cools under extreme pressure on Pyroclast.
pyroclast-scrap=Twisted metal debris and volcanic slag found across Pyroclast's ash fields. The primary raw material for basic and explosive war materials.
pyroclast-components=Exotic crystalline metal formations unique to Pyroclast. The primary raw material for construction and refined war materials.
pyroclast-refinery=A volcanic forge designed to process Pyroclast's raw scrap and components into war-grade materials. Can only be built on Pyroclast.
bmat=Basic materials refined from scrap under Pyroclast's extreme volcanic pressure.
cmat=Construction materials refined from components in the Pyroclast Refinery.
emat=Volatile explosive materials synthesized from scrap under Pyroclast's extreme volcanic conditions.
rmat=Precision-refined materials processed from components under extreme pressure.
hemat=Devastating heavy explosive materials combining scrap with sulfuric acid in Pyroclast's volcanic forges.
assmat1=Basic assembly materials for simple vehicles and machines. Forged from basic and explosive materials.
assmat2=Intermediate assembly materials for armored vehicles and trains. Built upon Assembly Materials I.
assmat3=Advanced assembly materials for robotics and heavy machinery. Requires refined materials and expertise.
assmat4=Elite assembly materials for the most powerful military and space equipment. The pinnacle of Pyroclast engineering.
pyroclast-rocket-silo=A reinforced rocket silo designed to withstand Pyroclast's extreme volcanic conditions. Can only be built on Pyroclast.

